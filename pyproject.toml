[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-api-integration"
version = "1.0.0"
description = "Reusable REST API client with retries, auth, pagination and validation"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
api-integration = "api_integration.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["api_integration"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
